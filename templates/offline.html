{% extends "base.html" %}

{% block title %}You're Offline — Career Reality India{% endblock %}

{% block content %}
<section class="container-reading cr-page-head" style="margin-top: var(--space-lg);">
    <p class="cr-kicker">Cached session</p>
    <h1>You're offline.</h1>
    <p>No internet connection detected. Previously visited pages remain available from cache.</p>
    <div class="hp-hero-actions" style="margin-top: 1.5rem; display:flex; gap: 12px; flex-wrap:wrap;">
        <button type="button" class="hp-btn hp-btn--primary" onclick="location.reload()">Try again</button>
        <a href="/" class="hp-btn hp-btn--ghost">Back to the terminal</a>
    </div>
</section>
{% endblock %}
