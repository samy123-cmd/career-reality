{% if seo_tool_hub %}
<section class="hp-tools" aria-labelledby="seo-tool-hub-title">
    <header class="hp-tools-header">
        <span class="hp-tools-eyebrow">Free career tools</span>
        <h2 id="seo-tool-hub-title" class="hp-tools-title">Make your next move with data</h2>
        <p class="hp-tools-sub">Calculators and trackers built for Indian tech professionals — not generic advice.</p>
    </header>

    <div class="hp-tools-panel" role="list">
        {% for tool in seo_tool_hub %}
        <a
            href="{% url tool.url_name %}"
            class="hp-tool-row"
            role="listitem"
        >
            <span class="hp-tool-index" aria-hidden="true">{{ forloop.counter|stringformat:"02d" }}</span>
            <span class="hp-tool-mark hp-tool-mark--{{ tool.icon }}" aria-hidden="true"></span>
            <span class="hp-tool-copy">
                <span class="hp-tool-name">{{ tool.label }}</span>
                <span class="hp-tool-desc">{{ tool.description }}</span>
            </span>
            <span class="hp-tool-go" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3.5 9H14.5M14.5 9L9.5 4M14.5 9L9.5 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </span>
        </a>
        {% endfor %}
    </div>
</section>
{% endif %}
