{% load static %}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}CareerReality — Uncomfortable Career Truths{% endblock %}</title>


<meta name="google-adsense-account" content="ca-pub-3766621537317806">
<meta name="robots" content="index, follow">
<link rel="canonical" href="{{ request.build_absolute_uri }}">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="article">
<meta property="og:url" content="{{ request.build_absolute_uri }}">
<meta property="og:title" content="{{ article.meta_title|default:'Career Reality (India)' }}">
<meta property="og:description"
    content="{{ article.meta_description|default:'The brutal truth about engineering careers in India.' }}">
<meta property="og:image" content="{% static 'img/og-default.png' %}">

<!-- Twitter -->
<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:url" content="{{ request.build_absolute_uri }}">
<meta property="twitter:title" content="{{ article.meta_title|default:'Career Reality (India)' }}">
<meta property="twitter:description"
    content="{{ article.meta_description|default:'The brutal truth about engineering careers in India.' }}">

<!-- Fonts - Non-blocking load -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" media="print"
    onload="this.media='all'">

<!-- Critical CSS for LCP (H1) - Inlined to avoid render blocking -->
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0
    }

    body {
        font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
        background: #fff;
        color: #666;
        font-size: 17px;
        line-height: 1.65
    }

    h1 {
        font-size: 48px;
        font-weight: 700;
        color: #000;
        line-height: 1.1;
        letter-spacing: -.02em;
        margin-bottom: 16px
    }

    .container-reading {
        max-width: 640px;
        margin: 0 auto;
        padding: 0 16px
    }

    .container-medium {
        max-width: 840px;
        margin: 0 auto;
        padding: 0 16px
    }

    .article-header {
        text-align: center
    }

    @media(max-width:768px) {
        h1 {
            font-size: 32px
        }
    }
</style>

<link rel="stylesheet" href="{% static 'css/style.css' %}?v=lcp1">

<!-- JSON-LD Organization & WebSite Schema -->
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Career Reality (India)",
    "alternateName": "CareerReality.in",
    "url": "{{ request.scheme }}://{{ request.get_host }}",
    "description": "The brutal truth about engineering careers in India. No-BS salary data, career reality checks, and honest career advice.",
    "publisher": {
        "@type": "Organization",
        "name": "Career Reality (India)",
        "url": "{{ request.scheme }}://{{ request.get_host }}",
        "sameAs": []
    }
}
</script>
