{% load static %}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- DNS Prefetch & Preconnect for fonts - REMOVED (Self-hosted) -->

<!-- Google AdSense auto-ads (required for approval) -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3766621537317806"
     crossorigin="anonymous"></script>

<meta name="google-adsense-account" content="ca-pub-3766621537317806">
<meta name="robots" content="{{ meta_robots|default:'index, follow' }}">
<link rel="canonical" href="{{ canonical_url|default:request.build_absolute_uri }}">
<link rel="alternate" hreflang="en-IN" href="{{ canonical_url|default:request.build_absolute_uri }}">
<link rel="alternate" hreflang="x-default" href="{{ canonical_url|default:request.build_absolute_uri }}">
<!-- Hindi hreflang removed: no Hindi translations exist in the database.
     Having identical /hi/ duplicates was flagged as low-value duplicate content. -->
<meta property="og:locale" content="en_IN">
<meta name="theme-color" content="#000000">
<meta name="author" content="Career Reality Editorial Desk">
<!-- Inlined Favicon to bypass static file 404s -->
<link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23000000'/%3E%3Ctext x='50' y='70' font-family='Arial, sans-serif' font-size='50' fill='%23ffffff' text-anchor='middle'%3ECR%3C/text%3E%3C/svg%3E">

<!-- Open Graph / Facebook -->
{% static 'img/og-default.svg' as og_default_image %}
{% static 'img/og-default.png' as og_default_image_png %}
{% with og_default_image_abs=site_base_url|add:og_default_image %}
{% with og_default_image_png_abs=site_base_url|add:og_default_image_png %}
<meta property="og:type" content="{{ og_type|default:'website' }}">
<meta property="og:url" content="{{ canonical_url|default:request.build_absolute_uri }}">
<meta property="og:site_name" content="Career Reality (India)">
<meta property="og:title"
    content="{{ og_title|default:article_meta_title|default:'Career Reality India - Salary Truths and Career Reality Checks' }}">
<meta property="og:description"
    content="{{ og_description|default:article_meta_description|default:'Unfiltered insights on Indian tech careers, salary stagnation, and real-world trade-offs.' }}">
<meta property="og:image" content="{{ og_image|default:og_default_image_png_abs }}">
<meta property="og:image:alt" content="Career Reality India editorial analysis preview image">

<!-- Twitter -->
<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:url" content="{{ canonical_url|default:request.build_absolute_uri }}">
<meta property="twitter:title"
    content="{{ twitter_title|default:og_title|default:article_meta_title|default:'Career Reality India - Salary Truths and Career Reality Checks' }}">
<meta property="twitter:description"
    content="{{ twitter_description|default:og_description|default:article_meta_description|default:'Unfiltered insights on Indian tech careers, salary stagnation, and real-world trade-offs.' }}">
<meta property="twitter:image" content="{{ twitter_image|default:og_image|default:og_default_image_png_abs }}">
{% endwith %}
{% endwith %}

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Career Reality",
  "url": "{{ site_base_url }}",
  "email": "samfischer14aug@gmail.com",
  "sameAs": [
    "https://www.careerreality.in/about/",
    "https://www.careerreality.in/editorial/",
    "https://www.careerreality.in/contact/",
    "https://www.careerreality.in/career-reality-index/"
  ]
}
</script>

<!-- Critical CSS - Inlined for instant FCP & Stability -->
<style>
    :root {
        --c-white: #ffffff;
        --c-black: #000000;
        --c-grey-dark: #222222;
        --c-grey-mid: #555555;
        --c-grey-light: #666666;
        --c-divider: #e6e6e6;
        --c-bg-footer: #f9f9f9;
        --c-blue-accent: #3a6ee8;
        --w-wide: 1100px;
        --w-medium: 840px;
        --w-narrow: 640px;
        --space-sm: 16px;
        --space-md: 48px;
        --space-lg: 96px;
        --space-xl: 180px
    }

    * {
        box-sizing: border-box
    }

    html {
        overflow-x: hidden;
    }

    body {
        background-color: var(--c-white);
        color: var(--c-grey-mid);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 17px;
        line-height: 1.65;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
    }

    /* Layout Containers */
    .container-wide {
        max-width: var(--w-wide);
        margin: 0 auto;
        padding: 0 var(--space-sm);
    }

    .container-medium {
        max-width: var(--w-medium);
        margin: 0 auto;
        padding: 0 var(--space-sm);
    }

    /* Typography */
    h1,
    h2,
    h3 {
        color: var(--c-black);
        line-height: 1.1;
        letter-spacing: -0.02em;
    }

    h1 {
        font-size: 64px;
        font-weight: 700;
        margin-top: 0;
        margin-bottom: var(--space-sm);
    }

    a {
        color: var(--c-black);
        text-decoration: none;
        transition: color 0.15s ease, border-color 0.15s ease;
    }

    a:hover {
        color: var(--c-blue-accent);
    }

    a:focus-visible {
        outline: 2px solid var(--c-blue-accent);
        outline-offset: 2px;
    }

    /* Site Header Critical */
    .site-header {
        padding: var(--space-md) 0;
        border-bottom: 1px solid var(--c-divider);
        position: sticky;
        top: 0;
        background: var(--c-white);
        z-index: 900;
    }

    .nav-flex {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .site-brand {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .brand-text {
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.15em;
        color: var(--c-black);
    }

    .brand-highlight {
        font-weight: 400;
        color: var(--c-grey-mid);
    }

    .site-nav {
        display: flex;
        align-items: center;
        gap: 0;
    }

    .nav-link,
    .nav-dropdown-trigger {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--c-grey-mid);
        padding: 8px 16px;
    }

    /* Mobile Toggle Critical */
    .mobile-menu-toggle {
        display: none;
        flex-direction: column;
        justify-content: space-between;
        width: 30px;
        height: 20px;
        cursor: pointer;
        z-index: 1002;
    }

    .mobile-menu-toggle span {
        display: block;
        width: 100%;
        height: 2px;
        background-color: var(--c-black);
        transition: all 0.3s ease;
    }

    /* Mobile Responsive Critical */
    @media (max-width:768px) {
        .site-nav {
            display: none !important;
        }

        .mobile-menu-toggle {
            display: flex;
        }

        .site-header {
            padding: 16px 0;
        }

        h1 {
            font-size: 42px;
        }
    }

    /* Font Faces */
    @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400;
        font-display: optional;
        src:url('{% static "fonts/Inter-Regular.woff2" %}') format('woff2')
    }

    @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 600;
        font-display: optional;
        src:url('{% static "fonts/Inter-SemiBold.woff2" %}') format('woff2')
    }

    @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 700;
        font-display: optional;
        src:url('{% static "fonts/Inter-Bold.woff2" %}') format('woff2')
    }

    /* CRITICAL LAYOUT STABILITY (Prevents CLS & LCP delay) */
    .mobile-nav {
        display: none !important;
        visibility: hidden !important;
    }

    .mobile-nav.active {
        display: block !important;
        visibility: visible !important;
    }

    .reality-split-container {
        contain: layout paint style;
        min-height: 55vh;
    }

    @media (max-width: 768px) {
        .reality-split-container {
            display: flex;
            flex-direction: column-reverse;
            min-height: 90vh;
        }
    }
</style>

<!-- Preload critical font weights -->
<link rel="preload" href="{% static 'fonts/Inter-Bold.woff2' %}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{% static 'fonts/Inter-Regular.woff2' %}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{% static 'fonts/Inter-SemiBold.woff2' %}" as="font" type="font/woff2" crossorigin>

<!-- Main CSS - Preload to reduce render-blocking time -->
<link rel="preload" href="{% static 'css/style.css' %}?v=6" as="style">
<link rel="stylesheet" href="{% static 'css/style.css' %}?v=6">

<!-- JSON-LD Organization & WebSite Schema -->
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Career Reality (India)",
    "alternateName": "CareerReality.in",
    "url": "{{ site_base_url }}",
    "description": "The brutal truth about engineering careers in India. No-BS salary data, career reality checks, and honest career advice.",
    "image": "{{ site_base_url }}{{ og_default_image_png }}",
    "publisher": {
        "@type": "Organization",
        "name": "Career Reality (India)",
        "url": "{{ site_base_url }}",
        "sameAs": []
    }
}
</script>
