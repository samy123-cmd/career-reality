<div class="utility-dock" id="utility-dock" role="navigation" aria-label="Quick tools">
    <div class="dock-container">
        <a href="{% url 'salary_calculator' %}" class="dock-item" data-dock-path="/salary-calculator/" title="True In-Hand Calculator">
            <div class="dock-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <rect x="4" y="2" width="16" height="20" rx="2"></rect>
                    <line x1="8" y1="6" x2="16" y2="6"></line>
                    <line x1="16" y1="14" x2="16" y2="18"></line>
                    <path d="M16 10h.01M12 10h.01M8 10h.01M12 14h.01M8 14h.01M12 18h.01M8 18h.01"></path>
                </svg>
            </div>
            <span class="dock-label">Calculator</span>
        </a>

        <a href="{% url 'salary_reality' %}" class="dock-item dock-mobile-hide" title="Market Salary Data">
            <div class="dock-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <line x1="12" y1="1" x2="12" y2="23"></line>
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                </svg>
            </div>
            <span class="dock-label">Reality Check</span>
        </a>

        <a href="{% url 'layoff_radar' %}" class="dock-item dock-alert" data-dock-path="/layoff-radar/" title="Layoff Risk Tracker">
            <div class="dock-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"></circle>
                    <circle cx="12" cy="12" r="4" fill="currentColor" fill-opacity="0.2"></circle>
                    <path d="M12 2v2M12 20v2M22 12h-2M4 12H2"></path>
                </svg>
            </div>
            <span class="dock-label">Layoff Radar</span>
        </a>

        <a href="{% url 'analyzer_home' %}" class="dock-item" data-dock-path="/resignation-risk/" title="Resignation Risk Analyzer">
            <div class="dock-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"></circle>
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12"></path>
                </svg>
            </div>
            <span class="dock-label">Risk Analyzer</span>
        </a>

        <a href="{% url 'company_directory' %}" class="dock-item dock-desktop-hide" data-dock-path="/companies/" title="Companies">
            <div class="dock-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4"></path>
                    <path d="M9 9v.01M9 12v.01M9 15v.01M9 18v.01"></path>
                </svg>
            </div>
            <span class="dock-label">Companies</span>
        </a>

        <a href="{% url 'submit_salary' %}" class="dock-item dock-mobile-hide" title="Share Anonymous Salary">
            <div class="dock-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                </svg>
            </div>
            <span class="dock-label">Salary Drop</span>
        </a>

        <button type="button" class="dock-item dock-item--more dock-desktop-hide" id="dock-more-trigger" aria-label="More tools" aria-expanded="false" aria-controls="more-sheet">
            <div class="dock-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <circle cx="12" cy="5" r="1.5" fill="currentColor"></circle>
                    <circle cx="12" cy="12" r="1.5" fill="currentColor"></circle>
                    <circle cx="12" cy="19" r="1.5" fill="currentColor"></circle>
                </svg>
            </div>
            <span class="dock-label">More</span>
        </button>
    </div>
</div>
