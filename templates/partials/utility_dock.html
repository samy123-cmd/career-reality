<div class="utility-dock">
    <div class="dock-container">
        <!-- 1. Salary Calculator -->
        <a href="{% url 'salary_calculator' %}" class="dock-item" title="True In-Hand Calculator">
            <div class="dock-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="4" y="2" width="16" height="20" rx="2" stroke="currentColor" fill="none"></rect>
                    <line x1="8" y1="6" x2="16" y2="6"></line>
                    <line x1="16" y1="14" x2="16" y2="18"></line>
                    <path d="M16 10h.01"></path>
                    <path d="M12 10h.01"></path>
                    <path d="M8 10h.01"></path>
                    <path d="M12 14h.01"></path>
                    <path d="M8 14h.01"></path>
                    <path d="M12 18h.01"></path>
                    <path d="M8 18h.01"></path>
                </svg>
            </div>
            <span class="dock-label">Calculator</span>
        </a>

        <!-- 2. Salary Reality Check -->
        <a href="{% url 'salary_reality' %}" class="dock-item" title="Market Salary Data">
            <div class="dock-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="1" x2="12" y2="23"></line>
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                </svg>
            </div>
            <span class="dock-label">Reality Check</span>
        </a>

        <!-- 3. Layoff Radar -->
        <a href="{% url 'layoff_radar' %}" class="dock-item dock-alert" title="Layoff Risk Tracker">
            <div class="dock-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <circle cx="12" cy="12" r="4" fill="currentColor" fill-opacity="0.2"></circle>
                    <path d="M12 2v2"></path>
                    <path d="M12 20v2"></path>
                    <path d="M22 12h-2"></path>
                    <path d="M4 12H2"></path>
                </svg>
            </div>
            <span class="dock-label">Layoff Radar</span>
        </a>

        <!-- 4. Anonymous Drop -->
        <a href="{% url 'submit_salary' %}" class="dock-item" title="Share Anonymous Salary">
            <div class="dock-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path
                        d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48">
                    </path>
                </svg>
            </div>
            <span class="dock-label">Salary Drop</span>
        </a>
    </div>
</div>
