<div class="cr-input-money">
  <label for="{{ field.id_for_label }}" class="cr-label">{{ field.label }}</label>
  <div class="cr-input-money__wrap">
    <span class="cr-input-money__prefix" aria-hidden="true">₹</span>
    {{ field }}
    <span class="cr-input-money__suffix" aria-hidden="true">LPA</span>
  </div>
  {% if field.help_text %}<small class="cr-help">{{ field.help_text }}</small>{% endif %}
  {% if field.errors %}<span class="cr-error">{{ field.errors.0 }}</span>{% endif %}
</div>
