{% extends "analyzer/step_base.html" %}

{% block wizard_content %}
<form method="post">
    {% csrf_token %}

    <!-- Field 1: Situation -->
    <div class="form-group">
        <label class="form-label">{{ form.current_situation.label }}</label>
        {% for radio in form.current_situation %}
        <label class="option-card">
            {{ radio.tag }} {{ radio.choice_label }}
        </label>
        {% endfor %}
    </div>

    <!-- Field 2: Performance -->
    <div class="form-group">
        <label class="form-label">{{ form.performance_status.label }}</label>
        {% for radio in form.performance_status %}
        <label class="option-card">
            {{ radio.tag }} {{ radio.choice_label }}
        </label>
        {% endfor %}
    </div>

    <!-- Field 3: Offer -->
    <div class="form-group">
        <label class="form-label">{{ form.has_offer.label }}</label>
        {% for radio in form.has_offer %}
        <label class="option-card">
            {{ radio.tag }} {{ radio.choice_label }}
        </label>
        {% endfor %}
    </div>

    <div class="analyzer-form-actions">
        <button type="submit" class="btn-analyzer">See Analysis</button>
    </div>
</form>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        var form = document.querySelector('form');
        if (!form || !window.crTrack) {
            return;
        }
        form.addEventListener('submit', function () {
            window.crTrack('analyze_submit', {
                funnel: 'resignation_risk',
                page: 'analyzer_step_3'
            });
        });
    });
</script>
{% endblock %}
