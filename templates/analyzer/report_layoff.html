{% extends 'base.html' %}

{% block title %}Report Layoffs — Career Reality{% endblock %}

{% block content %}
<section class="container-medium" style="margin-top: var(--space-lg); margin-bottom: var(--space-xl);">

    <div style="text-align: center; margin-bottom: 2rem;">
        <h1 style="font-size: 32px;">Report Status</h1>
        <p style="color: #666;">Anonymous. Secure. Help others avoid the trap.</p>
    </div>

    <div class="calculator-card"
        style="background: #fafafa; border: 1px solid var(--c-black); padding: 2rem; max-width: 500px; margin: 0 auto;">
        <form method="POST">
            {% csrf_token %}

            <div style="margin-bottom: 1.5rem;">
                <label
                    style="display: block; font-size: 11px; text-transform: uppercase; font-weight: 700; margin-bottom: 0.5rem;">Company
                    Name</label>
                <input type="text" name="company_name" placeholder="e.g. Byju's" required
                    style="width: 100%; padding: 12px; border: 2px solid var(--c-black);">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label
                    style="display: block; font-size: 11px; text-transform: uppercase; font-weight: 700; margin-bottom: 0.5rem;">Status</label>
                <select name="status" required style="width: 100%; padding: 12px; border: 1px solid #ccc;">
                    <option value="layoff">Active Layoffs (Danger)</option>
                    <option value="rumor">Internal Rumors / Bad Vibes</option>
                    <option value="freeze">Hiring Freeze</option>
                    <option value="hiring">Hiring Aggressively (Safe)</option>
                </select>
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label
                    style="display: block; font-size: 11px; text-transform: uppercase; font-weight: 700; margin-bottom: 0.5rem;">Role
                    Affected (Optional)</label>
                <input type="text" name="role_affected" placeholder="e.g. Sales Team, Junior Devs"
                    style="width: 100%; padding: 12px; border: 1px solid #ccc;">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label
                    style="display: block; font-size: 11px; text-transform: uppercase; font-weight: 700; margin-bottom: 0.5rem;">Location
                    (Optional)</label>
                <input type="text" name="location" placeholder="e.g. Bangalore"
                    style="width: 100%; padding: 12px; border: 1px solid #ccc;">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label
                    style="display: block; font-size: 11px; text-transform: uppercase; font-weight: 700; margin-bottom: 0.5rem;">Context
                    (Optional)</label>
                <textarea name="details" rows="3" placeholder="e.g. 20% of sales team let go. No severance."
                    style="width: 100%; padding: 12px; border: 1px solid #ccc; font-family: sans-serif;"></textarea>
            </div>

            <button type="submit"
                style="width: 100%; padding: 16px; background: #d93025; color: white; border: none; font-weight: 700; text-transform: uppercase; cursor: pointer;">
                Submit Report
            </button>
        </form>
    </div>

</section>
{% endblock %}
