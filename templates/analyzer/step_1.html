{% extends "analyzer/step_base.html" %}

{% block wizard_content %}
<form method="post">
    {% csrf_token %}

    <!-- Field 1: Company Type -->
    <div class="form-group">
        <label class="form-label">{{ form.company_type.label }}</label>
        {% for radio in form.company_type %}
        <label class="option-card">
            {{ radio.tag }} {{ radio.choice_label }}
        </label>
        {% endfor %}
    </div>

    <!-- Field 2: Role Level -->
    <div class="form-group">
        <label class="form-label">{{ form.role_level.label }}</label>
        {% for radio in form.role_level %}
        <label class="option-card">
            {{ radio.tag }} {{ radio.choice_label }}
        </label>
        {% endfor %}
    </div>

    <!-- Field 3: Explicit AI & Privacy Consent -->
    <div class="form-group"
        style="background: rgba(0,0,0,0.02); padding: 1.25rem; border-radius: 8px; border-left: 3px solid #000; margin-bottom: 2rem;">
        <label style="display: flex; align-items: flex-start; gap: 12px; cursor: pointer;">
            {{ form.consent }}
            <span style="font-size: 0.9rem; color: #444; line-height: 1.4;">
                <strong style="color: #000; display: block; margin-bottom: 4px;">Zero User Data Guarantee</strong>
                {{ form.consent.label }}
            </span>
        </label>
        {{ form.consent.errors }}
    </div>

    <button type="submit" class="btn-analyzer">Next &rarr;</button>
</form>
{% endblock %}
