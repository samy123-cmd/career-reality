<!DOCTYPE html>
<html lang="en-IN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Server Error - Career Reality India</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Georgia, "Times New Roman", serif;
            background: #f9f8f6;
            color: #666666;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            text-align: left;
        }
        .wrap { max-width: 480px; }
        .kicker {
            font-family: ui-monospace, monospace;
            font-size: 10px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #c84b31;
            margin-bottom: 12px;
        }
        .code {
            font-family: ui-monospace, monospace;
            font-size: 64px;
            font-weight: 400;
            color: #121212;
            line-height: 1;
            letter-spacing: -0.04em;
        }
        h1 { font-size: 28px; color: #121212; margin: 0.75rem 0 1rem; font-weight: 500; }
        p { line-height: 1.65; margin-bottom: 1.5rem; font-family: system-ui, sans-serif; }
        a.home {
            display: inline-block;
            margin-top: 0.5rem;
            padding: 0.75rem 1.25rem;
            background: #121212;
            color: #f9f8f6;
            text-decoration: none;
            font-family: ui-monospace, monospace;
            font-size: 12px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }
        .note { font-size: 13px; color: #888; margin-top: 2rem; font-family: system-ui, sans-serif; }
        .note a { color: #666; }
    </style>
</head>
<body>
    <div class="wrap">
        <p class="kicker">Terminal fault</p>
        <p class="code">500</p>
        <h1>Something went wrong on our end.</h1>
        <p>We've logged the error and will look into it. Please try again in a moment.</p>
        <a class="home" href="/">Back to the terminal</a>
        <p class="note">If this keeps happening, write to <a href="/contact/">careerreality.in/contact</a>.</p>
    </div>
</body>
</html>
