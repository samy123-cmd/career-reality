<!DOCTYPE html>
<html lang="en-IN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Server Error - Career Reality India</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #ffffff;
            color: #555555;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            text-align: center;
        }
        .wrap { max-width: 480px; }
        .code { font-size: 80px; font-weight: 900; color: #000000; line-height: 1; }
        h1 { font-size: 24px; color: #000000; margin: 0.5rem 0 1rem; }
        p { line-height: 1.6; margin-bottom: 1.5rem; }
        a {
            display: inline-block;
            margin-top: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: #000000;
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
        }
        .note { font-size: 13px; color: #888; margin-top: 2rem; }
    </style>
</head>
<body>
    <div class="wrap">
        <p class="code">500</p>
        <h1>Something went wrong on our end.</h1>
        <p>We've logged the error and will look into it. Please try again in a moment.</p>
        <a href="/">Back to Home</a>
        <p class="note">If this keeps happening, contact us at <a href="/contact/" style="background:none;color:#555;padding:0;font-weight:400;text-decoration:underline;">careerreality.in/contact</a>.</p>
    </div>
</body>
</html>
