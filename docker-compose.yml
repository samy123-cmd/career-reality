# Local / staging stack approximating production (web + redis).
# Postgres: keep using Supabase DATABASE_URL, or uncomment db service.
services:
  web:
    build: .
    command: ["web"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DEBUG: "False"
      PORT: "8000"
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: "localhost,127.0.0.1,web"
      CSRF_TRUSTED_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"
      SECURE_SSL_REDIRECT: "False"
      SECURE_HSTS_SECONDS: "0"
      RUN_DB_MIGRATE: "True"
      RUN_COLLECTSTATIC: "True"
      WEB_CONCURRENCY: "2"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  cron:
    build: .
    command: ["cron"]
    env_file:
      - .env
    environment:
      DEBUG: "False"
      REDIS_URL: redis://redis:6379/0
      SECURE_SSL_REDIRECT: "False"
      RUN_DB_MIGRATE: "False"
      RUN_COLLECTSTATIC: "False"
      TZ: Asia/Kolkata
    depends_on:
      - redis
      - web

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
